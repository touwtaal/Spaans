<header><div class="eyebrow" style="color:#cfe8b1">Spaans • toetsvoorbereiding</div><h1>¡Vamos! Grammatica trainer</h1><p>Ser, estar, klinkerwisseling en estar + gerundio. Leer, oefen, herhaal en toets jezelf.</p></header>

let state={page:'home',mode:null,queue:[],index:0,selected:null,submitted:false,answer:'',results:[],exam:false};

function el(s){return document.getElementById(s)}function escapeHTML(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function norm(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,;:]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function mk(id,section,prompt,answer,why,options){return {id,section,prompt,answer,why,options:options||null}}
const banks={serestar:[],forms:[],changes:[],gerund:[],mix:[]};
function add(section,id,prompt,answer,why,options){banks[section].push(mk(id,section,prompt,answer,why,options))}
const examples=[
['Pablo ___ mi amigo.','es','Identiteit of relatie: ser.'],['América ___ un continente.','es','Wat iets is: ser.'],['La fiesta ___ mañana.','es','Tijdstip van een gebeurtenis: ser.'],['La fiesta ___ a las dos.','es','Het tijdstip van een gebeurtenis: ser.'],['Rosa ___ inteligente.','es','Een eigenschap beschrijven: ser.'],['Los delfines ___ inteligentes.','son','Een eigenschap: ser.'],['El gato ___ enfermo.','está','Een veranderlijke toestand: estar.'],['La copa ___ vacía.','está','Een toestand / resultaat: estar.'],['La playa ___ al final de la calle.','está','Plaats van iets: estar.'],['Mis amigos ___ en casa.','están','Waar iemand is: estar.'],['Yo ___ de los Países Bajos.','soy','Herkomst of identiteit: ser.'],['Tú ___ cansado hoy.','estás','Tijdelijke toestand: estar.'],['Nosotros ___ estudiantes.','somos','Wat iemand is: ser.'],['Vosotros ___ en la escuela.','estáis','Waar iemand is: estar.'],['La profesora ___ simpática.','es','Eigenschap: ser.'],['El libro ___ encima de la mesa.','está','Locatie: estar.'],['¿Dónde ___ la playa?','está','Dónde vraagt naar de plaats: estar.'],['¿Cuándo ___ la fiesta?','es','Een evenement dat op een tijdstip plaatsvindt: ser.'],['¿Cómo ___ tu novia? (karakter)','es','Karakter of eigenschap: ser.'],['¿Cómo ___ tu novia? (ze voelt zich ziek)','está','Een veranderlijke toestand: estar.'],['La fiesta ___ en la playa.','es','Bij de locatie van een evenement gebruik je ser. Let op: dit verschilt van de locatie van een persoon of ding.'],['La playa ___ cerca del hotel.','está','Plaats van iets: estar.'],['La puerta ___ abierta.','está','Toestand/resultaat: estar.'],['Mi hermana ___ muy deportiva.','es','Blijvende of kenmerkende eigenschap: ser.'],['Hoy mis padres ___ muy contentos.','están','Toestand op dit moment: estar.'],['Nosotras ___ de Madrid.','somos','Herkomst: ser.'],['¿Quién ___ él?','es','Wie iemand is: ser.'],['¿Qué ___ eso?','es','Wat iets is: ser.'],['La clase ___ a las nueve.','es','Tijdstip van een les of gebeurtenis: ser.'],['Él ___ muy nervioso ahora.','está','Toestand op dit moment: estar.']];
examples.forEach((x,i)=>add('serestar','se'+i,'Vul de juiste vorm van <b>ser</b> of <b>estar</b> in:<br><em>'+x[0]+'</em>',x[1],x[2]));
for(const verb of ['ser','estar'])FORMS[verb].forEach((v,i)=>add('forms',verb+i,'Vervoeg <b>'+verb+'</b> voor <b>'+PEOPLE[i]+'</b>.',v,verb+' in de tegenwoordige tijd: '+PEOPLE.map((p,j)=>p+' '+FORMS[verb][j]).join(' · ')));
for(const verb of ['pedir','repetir','medir','servir','competir','elegir'])FORMS[verb].forEach((v,i)=>add('changes',verb+i,'Vervoeg <b>'+verb+'</b> ('+({pedir:'vragen',repetir:'herhalen',medir:'meten',servir:'bedienen',competir:'wedijveren',elegir:'kiezen'}[verb])+') voor <b>'+PEOPLE[i]+'</b>.',v,'Bij '+verb+' verandert e → i behalve bij nosotros en vosotros.'+(verb==='elegir'&&i===0?' Let op: yo elijo (g → j).':'')));
const GERUNDS=[['hablar','hablando','-ar → -ando'],['viajar','viajando','-ar → -ando'],['sacar','sacando','-ar → -ando'],['estudiar','estudiando','-ar → -ando'],['mirar','mirando','-ar → -ando'],['trabajar','trabajando','-ar → -ando'],['comer','comiendo','-er → -iendo'],['beber','bebiendo','-er → -iendo'],['hacer','haciendo','-er → -iendo'],['aprender','aprendiendo','-er → -iendo'],['vivir','viviendo','-ir → -iendo'],['escribir','escribiendo','-ir → -iendo'],['pedir','pidiendo','-e → -i bij dit werkwoord'],['medir','midiendo','-e → -i bij dit werkwoord'],['repetir','repitiendo','-e → -i bij dit werkwoord'],['servir','sirviendo','-e → -i bij dit werkwoord'],['competir','compitiendo','-e → -i bij dit werkwoord'],['elegir','eligiendo','-e → -i bij dit werkwoord']];
GERUNDS.forEach(([inf,g,why],i)=>add('gerund','g'+i,'Maak het <b>gerundio</b> van <b>'+inf+'</b>. (Alleen het gerundio.)',g,why+'. Het hele werkwoord is '+inf+'.'));
const PROG=[['Yo','estoy','viajando','viajar','Ik ben aan het reizen.'],['Tú','estás','comiendo','comer','Jij bent aan het eten.'],['Ella','está','haciendo','hacer','Zij is aan het doen/maken.'],['Nosotros','estamos','viviendo','vivir','Wij zijn aan het wonen.'],['Vosotros','estáis','estudiando','estudiar','Jullie zijn aan het studeren.'],['Ellos','están','pidiendo','pedir','Zij zijn aan het vragen.'],['Yo','estoy','midiendo','medir','Ik ben aan het meten.'],['Tú','estás','repitiendo','repetir','Jij bent aan het herhalen.'],['Él','está','sirviendo','servir','Hij is aan het bedienen.'],['Nosotras','estamos','sacando','sacar','Wij zijn foto’s aan het maken (sacar fotos).'],['Ellas','están','eligiendo','elegir','Zij zijn aan het kiezen.'],['Vosotros','estáis','hablando','hablar','Jullie zijn aan het praten.']];
PROG.forEach((x,i)=>{add('gerund','p'+i,'Vul de <b>volledige constructie</b> in ('+x[3]+'):<br><em>'+x[0]+' ___</em><br><small>'+x[4]+'</small>',x[1]+' '+x[2],'Gebruik een vervoeging van estar + gerundio.');add('mix','mp'+i,'Vertaal het werkwoordelijke deel naar het Spaans:<br><em>'+x[0]+' ___</em><br>'+x[4],x[1]+' '+x[2],'estar ('+x[1]+') + '+x[2]+'.')});
[
['Estoy ___ fotos. (sacar)','sacando','sacar → sacando'],['Estamos ___ por Perú. (viajar)','viajando','viajar → viajando'],['¿Qué estás ___? (hacer)','haciendo','hacer → haciendo'],['Él está ___ un libro. (leer)','leyendo','leer → leyendo (extra nuttig onregelmatig gerundio).'],['Ellas están ___ ayuda. (pedir)','pidiendo','pedir → pidiendo'],['Yo ___ enfermo hoy.','estoy','Toestand: estar (yo estoy).'],['Nosotros ___ simpáticos.','somos','Eigenschap: ser (nosotros somos).'],['¿Dónde ___ mis llaves?','están','Plaats: estar (ellas están).'],['La fiesta ___ a las ocho.','es','Tijdstip van gebeurtenis: ser.'],['Ustedes ___ en clase.','están','Plaats: estar (ustedes están).'],['Yo ___ la pregunta. (repetir)','repito','De e → i-wisseling bij repetir, yo repito.'],['Nosotros ___ la pregunta. (repetir)','repetimos','Nosotros houdt de e.'],['Ella ___ su vestido. (elegir)','elige','elegir → elige.'],['Yo ___ un vestido. (elegir)','elijo','Bij yo wordt eleg- → elij-.'],['¿Tú ___ agua? (pedir)','pides','pedir → pides.'],['Ellos ___ la mesa. (medir)','miden','medir → miden.'],['Nosotras ___ comida. (servir)','servimos','Geen klinkerwisseling bij nosotros.'],['Ellos están ___ ahora. (competir)','compitiendo','competir → compitiendo.'],['Vosotros ___ alumnos.','sois','ser, vosotros sois.'],['Vosotras ___ contentas hoy.','estáis','estar, vosotros/vosotras estáis.'],['¿Cómo ___ tu hermano? (karakter)','es','Karakter: ser.'],['¿Cómo ___ tu hermano? (vandaag)','está','Toestand: estar.'],['Las chicas están ___ español. (estudiar)','estudiando','estudiar → estudiando.'],['Los niños ___ en casa.','están','Plaats: estar.']
].forEach((x,i)=>add('mix','m'+i,'Vul in:<br><em>'+x[0]+'</em>',x[1],x[2]));
// Consistent, unambiguous items with meaningful distractors.
const mc=[['Voor een <b>eigenschap</b> van iemand gebruik je meestal…','ser',['ser','estar','gerundio'],'Eigenschap → ser.'],['Voor de <b>plaats van een persoon</b> gebruik je…','estar',['ser','estar','-ando'],'Plaats → estar.'],['De <b>tijd van een evenement</b> geef je aan met…','ser',['ser','estar','-iendo'],'La fiesta es a las dos.'],['Een <b>toestand die kan veranderen</b> geef je aan met…','estar',['ser','estar','pedir'],'El gato está enfermo.'],['Welke gerundio-uitgang hoort bij een -ar-werkwoord?','-ando',['-ando','-iendo','-ado'],'hablar → hablando.'],['Welke gerundio-uitgang hoort bij een normaal -ir-werkwoord?','-iendo',['-ando','-iendo','-ido'],'vivir → viviendo.'],['Bij welke personen ontbreekt meestal de klinkerwisseling e → i?','nosotros en vosotros',['yo en tú','nosotros en vosotros','él en ellos'],'pedimos en pedís, maar pido en piden.'],['Wat staat normaal bij elkaar in een zin met estar + gerundio?','estar + gerundio',['gerundio + ser','estar + gerundio','ser + infinitief'],'Estoy viajando, zonder Nederlands aan het ertussen.'],['Welke vraag past het beste bij het gebruik van ser voor iemands identiteit?','¿Quién?',['¿Dónde?','¿Quién?','¿Adónde?'],'¿Quién es?'],['Welke vraag past bij de locatie van iets?','¿Dónde?',['¿Dónde?','¿Cuándo?','¿Quién?'],'¿Dónde está?']];
mc.forEach((x,i)=>add(i<4?'serestar':i<8?'gerund':'mix','mc'+i,x[0],x[1],x[3],x[2]));
const SECTIONS=['serestar','forms','changes','gerund','mix'];const label={serestar:'Ser of estar',forms:'Vervoegingen',changes:'Klinkerwisseling e → i',gerund:'Gerundio en estar + gerundio',mix:'Mix en toepassen'};
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function nav(){el('nav').innerHTML=NAV.map(([id,n])=>'<button class="navbtn '+(state.page===id?'active':'')+'" data-page="'+id+'">'+n+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));const hist=saved.history;el('sideStats').innerHTML='<b>Voortgang</b><br>'+hist.length+' antwoorden gecontroleerd<br>'+ (hist.length?Math.round(hist.filter(x=>x.ok).length/hist.length*100):0)+'% ooit goed beantwoord<br>'+saved.exams.length+' proeftoets(en) afgerond'}
function go(page){state.page=page;state.mode=null;state.queue=[];state.results=[];state.index=0;state.submitted=false;nav();render();window.scrollTo({top:0,behavior:'instant'})}function html(s){el('main').innerHTML=s}
function hero(){return '<div class="eyebrow">Welkom</div><h2>Van uitleg naar toetszekerheid</h2><p>In dit oefenprogramma leer je alle grammatica uit de drie geelgroene lesboekdelen. Je oefent niet alleen herkennen, maar ook <b>zelf vervoegen en schrijven</b>.</p><div class="note"><b>Werkwijze:</b> lees eerst de uitleg, maak daarna per onderdeel de oefenset. Bij een fout krijg je uitleg en komt de vraag later terug in <b>Mijn fouten</b>. Sluit af met de proeftoets en herhaal totdat je ten minste 85% haalt.</div><div class="card"><h3>De complete leerroute</h3><div class="unit"><b>1. Ser of estar?</b> Identiteit, eigenschappen, tijdstip van evenementen, plaats en veranderlijke toestand.</div><div class="unit"><b>2. Alle vervoegingen</b> ser en estar: yo, tú, él/ella/usted, nosotros, vosotros, ellos/ustedes.</div><div class="unit"><b>3. Klinkerwisseling e → i</b> pedir, repetir, medir, servir, competir en elegir: alle zes personen.</div><div class="unit"><b>4. Gerundio</b> -ando, -iendo, speciale vormen pidiendo en midiendo, en estar + gerundio voor alle personen.</div><div class="unit"><b>5. Combineren</b> Betekenis, grammatica en zinsbouw door elkaar.</div><div class="unit"><b>6. Proeftoets</b> 30 gemengde vragen zonder hulp; beoordeling en verbeteradvies achteraf.</div></div><button class="btn" data-to="serestar">Start met onderdeel 1 →</button><button class="btn secondary" data-to="exam">Direct een proeftoets</button>'}
function lesson(section){let s='';if(section==='serestar')s=`<p>In het Nederlands betekent zowel <b>ser</b> als <b>estar</b> 'zijn'. Kies in het Spaans op basis van <b>wat je zegt</b>.</p><div class="responsive"><table><tr><th>Ser</th><th>Estar</th></tr><tr><td><b>Wie of wat?</b> Pablo <b>es</b> mi amigo.</td><td><b>Waar?</b> La playa <b>está</b> allí.</td></tr><tr><td><b>Eigenschap:</b> Rosa <b>es</b> inteligente.</td><td><b>Toestand / resultaat:</b> El gato <b>está</b> enfermo.</td></tr><tr><td><b>Tijdstip van gebeurtenis:</b> La fiesta <b>es</b> mañana / a las dos.</td><td><b>Aan het doen:</b> <b>Estoy</b> estudiando.</td></tr></table></div><div class="note"><b>Valkuil op de toets:</b> La fiesta <b>es</b> en la playa (locatie van een evenement). La playa <b>está</b> en España (locatie van een plaats/ding). Dit is een nuttige uitbreiding op het boek.</div>`;
if(section==='forms')s=`<p>Leer deze vervoegingen letterlijk uit je hoofd. Let op de <b>accenttekens</b>. In oefeningen tellen Spaanse accenten mee in de juiste schrijfwijze; een vergeten accent wordt als bijna goed beoordeeld, maar moet nog gecorrigeerd worden.</p><div class="responsive"><table><tr><th>Persoon</th><th>ser</th><th>estar</th></tr>${PEOPLE.map((p,i)=>`<tr><td>${p}</td><td><b>${FORMS.ser[i]}</b></td><td><b>${FORMS.estar[i]}</b></td></tr>`).join('')}</table></div><p><b>Geheugentip:</b> ser = soy, eres, es, somos, sois, son. Estar = estoy, estás, está, estamos, estáis, están.</p>`;
if(section==='changes')s=`<p>Bij deze werkwoorden op <b>-ir</b> verandert de <b>e</b> in de stam in een <b>i</b> bij <b>yo, tú, él/ella/usted en ellos/ellas/ustedes</b>. Bij <b>nosotros</b> en <b>vosotros</b> verandert de klinker niet.</p><div class="responsive"><table><tr><th>Persoon</th><th>repetir</th><th>pedir</th><th>elegir</th></tr>${PEOPLE.map((p,i)=>`<tr><td>${p}</td><td>${FORMS.repetir[i]}</td><td>${FORMS.pedir[i]}</td><td>${FORMS.elegir[i]}</td></tr>`).join('')}</table></div><p>Ook: <b>medir</b> (meten), <b>servir</b> (bedienen) en <b>competir</b> (concurreren). De uitgangen blijven die van gewone -ir-werkwoorden: -o, -es, -e, -imos, -ís, -en.</p><div class="note"><b>Let op:</b> bij <em>elegir</em> schrijf je <b>yo elijo</b> (niet 'eligo'). Bij de andere personen krijg je: eliges, elige, elegimos, elegís, eligen.</div>`;
if(section==='gerund')s=`<p><b>Estar + gerundio</b> betekent dat iemand <b>op dit moment iets aan het doen is</b>. Vervoeg eerst <b>estar</b> en zet er direct het gerundio achter.</p><div class="responsive"><table><tr><th>Hele werkwoord</th><th>Gerundio</th><th>Regel</th></tr><tr><td>viajar (reizen)</td><td><b>viajando</b></td><td>-ar → -ando</td></tr><tr><td>comer (eten)</td><td><b>comiendo</b></td><td>-er → -iendo</td></tr><tr><td>vivir (wonen)</td><td><b>viviendo</b></td><td>-ir → -iendo</td></tr><tr><td>pedir (vragen)</td><td><b>pidiendo</b></td><td>e → i in het gerundio</td></tr><tr><td>medir (meten)</td><td><b>midiendo</b></td><td>e → i in het gerundio</td></tr></table></div><p><b>Voorbeelden:</b> Estoy viajando por Perú. (Ik ben aan het reizen in Peru.) ¿Qué estás haciendo? (Wat ben je aan het doen?) Estamos sacando fotos. (Wij zijn foto's aan het maken.)</p><div class="note">Bij estar + gerundio staan de Spaanse werkwoorden <b>bij elkaar</b>: <em>estoy viajando</em>. Niet 'estoy aan het viajando'. Ook <em>repetir → repitiendo</em>, <em>servir → sirviendo</em> en <em>elegir → eligiendo</em>. Extra: <em>leer → leyendo</em>.</div>`;
if(section==='mix')s='<p>Nu komen de onderwerpen door elkaar. Lees de hele zin voordat je antwoordt: gaat het om identiteit, locatie, toestand, een werkwoord met klinkerwisseling of een handeling die bezig is?</p><div class="note">Toetsstrategie: 1. Bepaal welk werkwoord of welke constructie nodig is. 2. Zoek het onderwerp. 3. Vervoeg correct. 4. Controleer het accent en de spelling.</div>';
return s}
function sectionPage(sec){return `<div class="eyebrow">Uitleg en oefening</div><h2>${label[sec]}</h2>${lesson(sec)}<div class="card"><b>Oefenbank: ${banks[sec].length} vragen</b><p class="muted">Een ronde bevat maximaal 15 willekeurige vragen. Je kunt meerdere rondes maken om alle vormen te beheersen.</p><button class="btn" data-start="${sec}">Oefenronde starten (${Math.min(15,banks[sec].length)} vragen)</button><button class="btn secondary" data-all="${sec}">Alle ${banks[sec].length} vragen oefenen</button></div>`}
function render(){if(state.mode==='quiz')return renderQ();const p=state.page;if(p==='home')html(hero());else if(SECTIONS.includes(p))html(sectionPage(p));else if(p==='exam')html(examIntro());else html(weakPage());bind()}
function bind(){document.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>go(b.dataset.to));document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start,false));document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>start(b.dataset.all,true));document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>startExam());document.querySelectorAll('[data-weak]').forEach(b=>b.onclick=()=>startWeak());document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{if(confirm('Alle opgeslagen oefenresultaten wissen?')){saved={history:[],mastery:{},exams:[]};store();go('home')}})}
function start(sec,all){startQ(shuffle(banks[sec]).slice(0,all?undefined:15),false)}
function startQ(items,exam){state.mode='quiz';state.queue=items;state.index=0;state.submitted=false;state.selected=null;state.answer='';state.results=[];state.exam=exam;renderQ()}
function startExam(){const q=[];const counts={serestar:8,forms:6,changes:6,gerund:7,mix:3};Object.keys(counts).forEach(sec=>q.push(...shuffle(banks[sec]).slice(0,counts[sec])));startQ(shuffle(q),true)}
function grade(q,a){const exact=s=>String(s).toLowerCase().trim().replace(/\s+/g,' ');if(exact(a)===exact(q.answer))return {ok:true,accent:false};if(!q.options&&norm(a)===norm(q.answer))return {ok:false,accent:true};return {ok:false,accent:false}}
function renderQ(){if(state.index>=state.queue.length)return finish();let q=state.queue[state.index],pct=state.index/state.queue.length*100;html(`<div class="flex"><span class="eyebrow">${state.exam?'Proeftoets':'Oefenen • '+label[q.section]}</span><b>${state.index+1} / ${state.queue.length}</b></div><div class="progress"><div style="width:${pct}%"></div></div><p class="mini">${state.exam?'Toetsmodus: feedback na afloop.':'Je krijgt meteen uitleg bij elke vraag.'}</p><div class="question">${q.prompt}</div>${q.options?`<div id="choices">${q.options.map((o,i)=>`<button class="option" data-choice="${i}">${escapeHTML(o)}</button>`).join('')}</div>`:`<input class="answer" id="ans" aria-label="Jouw antwoord" placeholder="Typ je Spaanse antwoord" autocomplete="off" spellcheck="false"><p class="mini">Accenten: á é í ó ú ñ • Enter = controleren</p>`}<div id="feedback"></div><div><button class="btn" id="check">${state.exam?'Antwoord opslaan':'Controleer antwoord'}</button><button class="btn secondary hidden" id="next">${state.index+1===state.queue.length?'Bekijk resultaat':'Volgende vraag →'}</button></div>`);
if(q.options){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(state.submitted)return;state.selected=q.options[+b.dataset.choice];document.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b))})}else{el('ans').value=state.answer;el('ans').focus();el('ans').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();state.submitted?next():check()}})}el('check').onclick=check;el('next').onclick=next}
function check(){if(state.submitted)return;const q=state.queue[state.index],a=q.options?state.selected:el('ans').value.trim();if(!a){el('feedback').innerHTML='<div class="alert">Vul eerst een antwoord in.</div>';return}let g=grade(q,a);state.submitted=true;state.results.push({q,a,ok:g.ok,accent:g.accent});saved.history.push({id:q.id,sec:q.section,ok:g.ok,date:Date.now()});saved.mastery[q.id]=g.ok;store();el('check').classList.add('hidden');el('next').classList.remove('hidden');if(q.options){document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct');if(b.textContent===a&&!g.ok)b.classList.add('incorrect')})}else el('ans').disabled=true;if(!state.exam)el('feedback').innerHTML=`<div class="${g.ok?'success':'alert'}"><b>${g.ok?'Goed gedaan!':g.accent?'Bijna goed: let op de accenttekens.':'Nog niet goed.'}</b>${g.ok?'':'<br>Jouw antwoord: '+escapeHTML(a)+'<br><b>Juiste antwoord: '+escapeHTML(q.answer)+'</b>'}<br>${escapeHTML(q.why)}</div>`;else el('feedback').innerHTML='<div class="success">Antwoord opgeslagen. Uitleg volgt na afloop.</div>'}
function next(){if(!state.submitted)return;state.index++;state.submitted=false;state.selected=null;state.answer='';renderQ();}
function finish(){const n=state.results.length,good=state.results.filter(r=>r.ok).length,pct=Math.round(good/n*100),miss=state.results.filter(r=>!r.ok);if(state.exam){saved.exams.push({date:Date.now(),score:good,total:n});store()}let title=state.exam?'Uitslag proeftoets':'Oefenronde afgerond';html(`<div class="eyebrow">Resultaat</div><h2>${title}</h2><div class="card"><div style="font-size:42px;font-weight:850;color:var(--green)">${pct}%</div><b>${good} van de ${n} antwoorden goed</b><p>${pct>=85?'Goed niveau! Controleer hieronder of je alle regels kunt uitleggen.':pct>=65?'Je bent op weg. Herhaal vooral de fout beantwoorde vormen.':'Er is nog oefening nodig. Lees de uitleg opnieuw en maak gerichte herhalingsrondes.'}</p></div>${miss.length?`<h3>Verbeterlijst (${miss.length})</h3>${miss.map((r,i)=>`<div class="unit"><b>Vraag ${i+1} • ${label[r.q.section]}</b><div>${r.q.prompt}</div><div class="mini">Jouw antwoord: ${escapeHTML(r.a)}</div><b>Goed: ${escapeHTML(r.q.answer)}</b><div>${escapeHTML(r.q.why)}</div></div>`).join('')}`:'<div class="success">Alle vragen goed! Probeer ook een nieuwe willekeurige ronde.</div>'}<button class="btn" data-to="${state.exam?'exam':state.page}">Terug naar overzicht</button><button class="btn secondary" data-to="weak">Mijn fouten oefenen</button>`);state.mode=null;bind();nav()}
function examIntro(){const best=saved.exams.length?Math.max(...saved.exams.map(e=>Math.round(e.score/e.total*100))):null;return `<div class="eyebrow">Eindcontrole</div><h2>Proeftoets • 30 vragen</h2><p>Een toetsachtige mix van de leerstof. De vragen worden steeds opnieuw willekeurig gekozen. Je krijgt <b>pas aan het einde</b> de antwoorden met uitleg te zien.</p><div class="card"><b>Verdeling</b><p>8× ser / estar • 6× vervoegingen • 6× klinkerwisseling • 7× gerundio • 3× alles door elkaar.</p><p>Doel: <b>minstens 85%</b> (26/30 goed), maar voor echte toetszekerheid streef je naar <b>90–100%</b> in twee verschillende rondes.</p>${best===null?'Nog geen proeftoets gemaakt.':'Hoogste score tot nu toe: <b>'+best+'%</b>.'}</div><button class="btn" data-exam="1">Start proeftoets</button>`}
function weakPage(){const ids=Object.keys(saved.mastery).filter(k=>saved.mastery[k]===false);const all=Object.values(banks).flat(),q=all.filter(x=>ids.includes(x.id));return `<div class="eyebrow">Persoonlijke herhaling</div><h2>Mijn fouten</h2><p>Een vraag komt hier terecht als je die <b>voor het laatst fout</b> hebt beantwoord. Na een goed antwoord verdwijnt deze uit je foutenlijst.</p><div class="card"><b>${q.length} openstaande foutvragen</b><p>${q.length?'Oefen ze opnieuw totdat je ze goed beheerst.':'Nog geen openstaande fouten. Maak een oefenronde om je kennis te testen.'}</p><button class="btn" data-weak="1" ${q.length?'':'disabled'}>Oefen mijn fouten (${q.length})</button></div><button class="btn secondary" data-to="home">Terug naar start</button><button class="btn outline" data-reset="1">Voortgang wissen</button>`}
function startWeak(){let ids=Object.keys(saved.mastery).filter(k=>saved.mastery[k]===false),q=Object.values(banks).flat().filter(x=>ids.includes(x.id));if(q.length)startQ(shuffle(q),false)}
nav();render();
</script></body></html>
